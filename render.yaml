# Render Blueprint — deploys the agent, dashboard and LinkedIn autopilot.
# Render → New → Blueprint → pick this repo. See README "Deploy to the cloud".
services:
  - type: web
    name: ai-agent
    runtime: docker
    # Always-on instance with a persistent disk (free instances sleep and have no disk,
    # so they would miss Monday/Thursday posts and lose your tasks).
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: agent-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Dashboard login — generated by Render; copy it from the Environment tab.
      - key: API_KEY
        generateValue: true
      # You'll be asked for these when creating the Blueprint:
      - key: OPENAI_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: ZENODO_ORCID
        sync: false
      - key: LINKEDIN_TIMEZONE
        sync: false
      # Defaults (edit any time in the Environment tab):
      - key: GITHUB_USERNAME
        value: kiritreddy97-droid
      - key: ZENODO_AUTHOR
        value: Kirit Reddy Daida
      - key: LINKEDIN_POST_DAYS
        value: mon,thu
      - key: LINKEDIN_POST_TIME
        value: "09:00"
      - key: LINKEDIN_AUTO_PUBLISH
        value: "false"
      - key: TASKS_DB
        value: /app/data/tasks.db
      - key: LOG_FILE
        value: /app/data/agent.log
